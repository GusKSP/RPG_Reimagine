<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="./css/rpgreimagine/estilo.css">

  <!-- Mais fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Miss+Fajardose&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gasoek+One&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    rel="stylesheet">
</head>

<body>
  <div class="header">
    <div class="container">
      <div class="esquerda">
        <div class="logo" onclick="location.href='index.html'">
        </div>
      </div>
      <ul class="navbar">
        <li>
          <div class="btn_navbar">
            <a href="login_rpgreimagine.html">Login</a>
          </div>
        </li>
        <li class="agora">
          <div class="btn_navbar">
            <a href="#">Cadastro</a>
          </div>
        </li>
      </ul>
    </div>
  </div>

  <div class="login">
    <div class="container">
      <div class="card card-cadastro">
        <h2>Cadastre-se</h2>
        <div class="formulario">

          <div class="campo">
            <span>Nome:</span>
            <input id="nome_input" type="text" placeholder="Nome de usuario" />
          </div>
          <div class="campo">
            <span>E-mail:</span>
            <input id="email_input" type="text" placeholder="usuario@gmail.com" />
          </div>
          <div class="campo">
            <span>Senha:</span>
            <input id="senha_input" type="password" placeholder="******" />
          </div>
          <div class="campo">
            <span>Confirmar Senha:</span>
            <input id="confirmacao_senha_input" type="password" placeholder="******" />
          </div>
          <button class="botao" onclick="validar()">Cadastrar</button>
        </div>
        <div id="div_aguardar" class="loading-div">
          <img src="../assets/imgs/circle-loading.gif" id="loading-gif" />
        </div>

        <div class="alerta_erro">
        </div>

        <div id="div_erros_login"></div>
      </div>
    </div>

    <div class="card_erro" id="cardErro">
      <span id="mensagem_erro"></span>
    </div>
  </div>

  <div class="footer">
    <div class="container">
      <div class="esquerda">
        <h4>Para jogar, Crie ou Entre em sua Conta!</h4>
        <p>Já tem uma conta? faça seu
          <a href="./login_rpgreimagine.html">Login!</a>
        </p>


        <p>Não tem uma conta? faça seu
          <a href="./cadastro_rpgreimagine.html">Cadastro!</a>
        </p>
      </div>
      <div class="meio">
        <h4 onclick="window.location.href = 'index.html#Sobre'">Sobre o RpgReimagine</h4>
      </div>
      <div class="direita">
        <div class="horizontal">
          <img src="./assets/imgs_rpgreimagine/DICE_RPGREIMAGINE_PixelArt.png" alt="logo_rpg_reimagine">

          <h4>Tem alguma Reclamação ou Dúvida?</h4>
        </div>
        <p>Email para contato: <a href="mailto:gus.paulino@sptech.school">gus.paulino@sptech.school</a></p>
      </div>
    </div>
  </div>
</body>

</html>
<script src="../js/sessao.js"></script>
<script src="../js/alerta.js"></script>

<script>


  async function validar() {


    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    let nomeVar = nome_input.value;
    let emailVar = email_input.value;
    let senhaVar = senha_input.value;
    let confirmacaoSenhaVar = confirmacao_senha_input.value;
    let idUsuarioVincular;
    // Verificando se há algum campo em branco
    nomeVar.trim();
    emailVar = emailVar.trim().toLowerCase();
    if (
      nomeVar.trim() === "" ||
      emailVar.trim() === "" ||
      senhaVar.trim() === "" ||
      confirmacaoSenhaVar.trim() === ""
    ) {
      mensagem_erro.innerHTML = "Campos em branco. Por favor, preencha todos os campos para realizar o cadastro!";
      mostrarErro();

      //finalizarAguardar();
      return false;
    }
    //Verificando se email sendo cadastrado já existe no Banco de Dados

    fetch("/usuariosRpg/emailRegistrado", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        emailServer: emailVar
      })
    })
      .then(function (resposta) {
        if (resposta.ok) {
          console.log(resposta);
          resposta.json().then(json => {
            console.log(json);
            console.log(JSON.stringify(json));
            if (json.length > 0) {
              mostrarErro()
              mensagem_erro.textContent = "Email já cadastrado, deseja fazer "
              mensagem_erro.innerHTML += "<a href='login_rpgreimagine.html'>Login?</a>"
              console.log("Email já cadastrado");
              return false
            } else {
              console.log("Email ainda não cadastrado");
            }
          });
        } else {
          console.log("Houve um erro ao verificar o email!");
          resposta.text().then(texto => {
            console.error(texto);
            return false
          });
        }
      })
      .catch(function (erro) {
        console.log(erro);
      });

    let nomeComTresCaracteres = true;
    if (nomeVar.length < 3) {
      mostrarErro();
      mensagem_erro.innerHTML = "Nome inválido. O nome deve conter pelo menos 3 caracteres!";
      nomeComTresCaracteres = false;
      return false;
    }
    else {
      console.log("Nome válido. Prosseguir com cadastro.");
    }
    let nomeLongo = false
    if (nomeVar.length > 500) {
      nomeLongo = true;
      mostrarErro();
      mensagem_erro.innerHTML = "Nome inválido. O nome deve conter no máximo 500 caracteres!";
      nomeComTresCaracteres = false;
      return false;
    }
    else {
      console.log("Nome válido. Prosseguir com cadastro.");
    }

    // Verificando se o nome tem pelo menos 3 caracteres e contém apenas letras e espaços
    let nomeSemCaracteresEspeciais = true;
    const ListaCaracteresEspeciais = "!@#$%^&*()_+[]{}|;'\":,./<>?`~";
    for (let i = 0; i < nomeVar.length; i++) {
      if (ListaCaracteresEspeciais.includes(nomeVar[i])) {
        nomeSemCaracteresEspeciais = false;
        break;
      }
    }
    if (!nomeSemCaracteresEspeciais) {
      mensagem_erro.innerHTML = "Nome inválido. O nome não pode conter caracteres especiais!";
      mostrarErro();
      return false;
    }

    let emailSemEspacos = true;
    if (emailVar.includes(" ")) {
      mostrarErro();
      mensagem_erro.innerHTML = "Email inválido. O email não pode conter espaços!";
      emailSemEspacos = false;
      return false;
    }
    else {
      console.log("Email sem espaços. Prosseguir com cadastro.");
    }



    // Verificando se o email cadastrado tem um formato válido
    // Constante que define a expressão regular (regex = regular expression) para validar o formato do email

    let EmailValidar = false
    let EmailArroba = emailVar.split('@')
    let EmailInvalido = true
    let EmailLongo = false
    console.log(EmailArroba)
    if (emailVar.length > 320) {

      console.log("Email deve muito longo")
      mostrarErro();
      mensagem_erro.innerHTML = "Email muito grande!"
      return false;
    }
    if (!emailVar.includes("@") || !emailVar.includes(".")) {
      console.log("Email deve conter @ e .")
      mostrarErro();
      mensagem_erro.innerHTML = "Email deve conter um arroba"
      return false;
    }
    if (EmailArroba[0] == "" || EmailArroba[1] == "" || EmailArroba[1].length < 7 || EmailArroba.length > 2) {
      console.log("Primeira parte do Email Incorreta")
      mostrarErro();
      mensagem_erro.innerHTML = "Email Inválido"
      return false;
    }
    else {
      let EmailPonto = EmailArroba[1].split('.')
      if (EmailPonto[0] == "" || EmailPonto[0].length < 3) {
        console.log("Segunda parte do Email Incorreta")
        mostrarErro();
        mensagem_erro.innerHTML = "Email Inválido"
        return false;
      }
      else if (EmailPonto[1] == "" || EmailPonto[1].length < 3) {
        console.log("Terceira parte do Email Incorreta")
        mostrarErro();
        mensagem_erro.innerHTML = "Email Inválido"
        return false;
      }
      else {
        EmailValidar = true
        console.log("Email válido. Prosseguir com cadastro.")
      }
    }

    // Verificando se a senha tem pelo menos 6 caracteres
    let senhaValida = true;
    if (senhaVar.length < 6) {
      mostrarErro();
      mensagem_erro.innerHTML = "Senha inválida. A senha deve conter pelo menos 6 caracteres!";
      senhaValida = false;
      return false;
    }

    if (senhaVar.length > 4096) {
      mostrarErro();
      mensagem_erro.innerHTML = "Senha inválida. A senha no máximo 4096 caracteres!";
      senhaValida = false;

    }
    else {
      senhaValida = true;
      console.log("Senha válida. Prosseguir com cadastro.");
    }

    // Verificando se a senha e a confirmação de senha são iguais
    let SenhasIguais = true
    if (senhaVar != confirmacaoSenhaVar) {
      mensagem_erro.innerHTML = "As senhas devem ser iguais no campo de senha e confirmar senha";
      mostrarErro();
      SenhasIguais = false;
      return false;
    }
    else {
      SenhasIguais = true;
      console.log("Senhas iguais. Prosseguir com cadastro.");
    }

    // Enviando o valor da nova input

    if (nomeSemCaracteresEspeciais && nomeComTresCaracteres && !nomeLongo && EmailValidar && emailSemEspacos && senhaValida && SenhasIguais && !EmailLongo) {
      console.log("Todos os campos são válidos. Prosseguir com cadastro.");

      fetch("/usuariosRpg/cadastrarRpg", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          // crie um atributo que recebe o valor recuperado aqui
          // Agora vá para o arquivo routes/usuario.js
          nomeServer: nomeVar,
          emailServer: emailVar,
          senhaServer: senhaVar,
          idUsuarioVincularServer: idUsuarioVincular
        }),
      })
        .then(function (resposta) {
          console.log("resposta: ", resposta);

          if (resposta.ok) {
            mostrarErro();

            mensagem_erro.innerHTML =
              "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

            setTimeout(() => {
              window.location = "login_rpgreimagine.html";
            }, "2000");

            limparFormulario();
            //finalizarAguardar();
          } else {
            throw "Houve um erro ao tentar realizar o cadastro!";
          }
        })
        .catch(function (resposta) {
          console.log(`#ERRO: ${resposta}`);
          //finalizarAguardar();
        });

      return false;
    }
  }
  function sumirMensagem() {
    cardErro.style.display = "none";
  }

  function mostrarErro() {
    cardErro.style.display = "block";
    mensagem_erro.style.display = "block";
    setTimeout(sumirMensagem, 1000);
  }
</script>
