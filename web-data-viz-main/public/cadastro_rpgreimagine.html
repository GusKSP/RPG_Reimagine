  <div class="header">

          <div class="btn_navbar">

  <div class="login">

          </div>
          <button class="botao" onclick="validar()">Cadastrar</button>

<script src="../js/sessao.js"></script>
<script src="../js/alerta.js"></script>

<script>

  // Array para armazenar usuarios cadastrados para validação de código de ativação 
  let VerificarEmailCadastrado = "";

  function validar() {

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;
    var idUsuarioVincular;
    // Verificando se há algum campo em branco
    if (
      nomeVar.trim() === "" ||
      emailVar.trim() === "" ||
      senhaVar.trim() === "" ||
      confirmacaoSenhaVar.trim() === ""
    ) {
      mensagem_erro.innerHTML = "Campos em branco. Por favor, preencha todos os campos para realizar o cadastro!";
      mostrarErro();

      finalizarAguardar();
      return false;
    }

    let nomeComTresCaracteres = true;
    if (nomeVar.length < 3) {
      mostrarErro();
      mensagem_erro.innerHTML = "Nome inválido. O nome deve conter pelo menos 3 caracteres!";
      nomeComTresCaracteres = false;
      return false;
    }
    else {
      console.log("Nome válido. Prosseguir com cadastro.");
    }
    let nomeLongo = false
    if (nomeVar.length > 100) {
      nomeLongo = true;
      mostrarErro();
      mensagem_erro.innerHTML = "Nome inválido. O nome deve conter no máximo 100 caracteres!";
      nomeComTresCaracteres = false;
      return false;
    }
    else {
      console.log("Nome válido. Prosseguir com cadastro.");
    }

    // Verificando se o nome tem pelo menos 3 caracteres e contém apenas letras e espaços
    let nomeSemCaracteresEspeciais = true;
    const ListaCaracteresEspeciais = "!@#$%^&*()_+[]{}|;'\":,./<>?`~";
    for (let i = 0; i < nomeVar.length; i++) {
      if (ListaCaracteresEspeciais.includes(nomeVar[i])) {
        nomeSemCaracteresEspeciais = false;
        break;
      }
    }
    if (!nomeSemCaracteresEspeciais) {
      mensagem_erro.innerHTML = "Nome inválido. O nome não pode conter caracteres especiais!";
      mostrarErro();
    }

    let emailSemEspacos = true;
    if (emailVar.includes(" ")) {
      mostrarErro();
      mensagem_erro.innerHTML = "Email inválido. O email não pode conter espaços!";
      emailSemEspacos = false;
      return false;
    }
    else {
      console.log("Email sem espaços. Prosseguir com cadastro.");
    }



    // Verificando se o email cadastrado tem um formato válido
    // Constante que define a expressão regular (regex = regular expression) para validar o formato do email

    let EmailValidar = false
    let EmailArroba = emailVar.split('@')
    let EmailInvalido = true
    if (EmailArroba[0] == "" || EmailArroba[1] == "" || EmailArroba[1].length < 7 || EmailArroba.length > 2) {
      console.log("Primeira parte do Email Incorreta")
      mostrarErro();
      mensagem_erro.innerHTML = "Email Inválido"
      return false;
    }
    else {
      let EmailPonto = EmailArroba[1].split('.')
      if (EmailPonto[0] == "" || EmailPonto[0].length < 3) {
        console.log("Segunda parte do Email Incorreta")
        mostrarErro();
        mensagem_erro.innerHTML = "Email Inválido"
        return false;
      }
      else if (EmailPonto[1] == "" || EmailPonto[1].length < 3) {
        console.log("Terceira parte do Email Incorreta")
        mostrarErro();
        mensagem_erro.innerHTML = "Email Inválido"
        return false;
      }
      else {
        EmailInvalido = false
        console.log("Email válido. Prosseguir com cadastro.")
      }
    }

    // Verificando se a senha tem pelo menos 6 caracteres
    let senhaValida = true;
    if (senhaVar.length < 6) {
      mensagem_erro.innerHTML = "Senha inválida. A senha deve conter pelo menos 6 caracteres!";
      mostrarErro();
      senhaValida = false;
      return false;
    }
    else {
      senhaValida = true;
      console.log("Senha válida. Prosseguir com cadastro.");
    }

    // Verificando se a senha e a confirmação de senha são iguais
    let SenhasIguais = true
    if (senhaVar != confirmacaoSenhaVar) {
      mensagem_erro.innerHTML = "As senhas devem ser iguais no campo de senha e confirmar senha";
      mostrarErro();
      SenhasIguais = false;
      return false;
    }
    else {
      SenhasIguais = true;
      console.log("Senhas iguais. Prosseguir com cadastro.");
    }

    // Verificando se o email é de algum usuário já cadastrado
    var usuarioEncontrado = false;
    for (let i = 0; i < listaUsuariosCadastrados.length; i++) {
      if (listaUsuariosCadastrados[i] == emailVar) {
        usuarioEncontrado = true;
        mostrarErro();
        mensagem_erro.innerHTML = "Email já cadastrado. Deseja fazer login?";
        return false;
      } else {
        console.log("Email não encontrado. Prosseguir com cadastro.");
      }
    }
    // Enviando o valor da nova input

    if (nomeSemCaracteresEspeciais && nomeComTresCaracteres && !nomeLongo && EmailValidar && emailSemEspacos && senhaValida && SenhasIguais && !usuarioEncontrado) {
      console.log("Todos os campos são válidos. Prosseguir com cadastro.");


      fetch("/usuariosRpg/cadastrarRpg", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          // crie um atributo que recebe o valor recuperado aqui
          // Agora vá para o arquivo routes/usuario.js
          nomeServer: nomeVar,
          emailServer: emailVar,
          senhaServer: senhaVar,
          idUsuarioVincularServer: idUsuarioVincular
        }),
      })
        .then(function (resposta) {
          console.log("resposta: ", resposta);

          if (resposta.ok) {
            mostrarErro();

            mensagem_erro.innerHTML =
              "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

            setTimeout(() => {
              window.location = "login_rpgreimagine.html";
            }, "2000");

            limparFormulario();
            finalizarAguardar();
          } else {
            throw "Houve um erro ao tentar realizar o cadastro!";
          }
        })
        .catch(function (resposta) {
          console.log(`#ERRO: ${resposta}`);
          finalizarAguardar();
        });

      return false;
    }
  }

  // Verificando se email inserido já existe no banco de dados 
  function Verificar() {
    fetch("/usuariosRpg/listarRpg", {
      method: "GET",
    })
      .then(function (resposta) {
        resposta.json().then((usuarios) => {
          usuarios.forEach((usuario) => {
            listaUsuariosCadastrados.push(usuario);

            console.log("listaUsuariosCadastrados")
            console.log(listaUsuariosCadastrados)
          });
        });
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }

  function mostrarErro() {
    cardErro.style.display = "block";
    mensagem_erro.style.display = "block";
    setTimeout(sumirMensagem, 5000);
  }
</script>
