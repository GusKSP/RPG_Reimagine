<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG REIMAGINE | seu_mundo</title>
    <link rel="stylesheet" href="css/rpgreimagine/SeuMundo.css">
</head>

<body>
    <div class="container">
        <img src="" alt="">
        <div class="horizontal centralizar_linha">
            <div class="vertical centralizar_linha">
                <div class="WImage">
                    <img src="./assets/imgs_rpgreimagine/World_IMG_example.png" alt="Imagem_Do_Mundo">
                </div>
                <label for="WDropImage" class="WDropImageButton">Alterar Imagem</label>
                <input type="file" id="WDropImage" accept="image/png, image/jpeg" multiple>
            </div>
            <input type="text" value="Seu Mundo" id="" class="WName">
        </div>
        <div class="mundo">
            <h3>descrição:</h3>
            <div id="container" class="descricao">
                <textarea id="" value="" placeholder="Coloque a descrição de seu mundo"></textarea>
            </div>
        </div>
        <div class="vertical">
            <h3>Informações do personagem</h3>
            <div class="div_Imagem">
                <div class="vertical">
                    <div class="horizontal centralizar_linha">
                        <label for="imgCharacter" class="fakeButton">
                            <img src="./assets/imgs_rpgreimagine/edit_text_No_Mouse.png"
                                onmouseover="this.src='./assets/imgs_rpgreimagine/edit_text_OnMouse.png'"
                                onmouseout="this.src='./assets/imgs_rpgreimagine/edit_text_No_Mouse.png'"
                                alt="editar nome">
                        </label>
                        <div class="vertical centralizar_linha">
                            <h4>imagem</h4>
                            <input type="text" name="" id="imgCharacter">
                            <div class="personagem_img"><img src="./assets/imgs_rpgreimagine/User_IMG_Exemple.png"
                                    alt="imagem_do_personagem"></div>
                        </div>
                        <label class="fakeButton">
                            <img src="./assets/imgs_rpgreimagine/Trash_No_Mouse.png"
                                onmouseover="this.src='./assets/imgs_rpgreimagine/Trash_OutMouse.png'"
                                onmouseout="this.src='./assets/imgs_rpgreimagine/Trash_No_Mouse.png'" alt="editar nome">
                        </label>
                        <h3>Nome do Personagem</h3>
                    </div>
                    <textarea name="descricao" placeholder="Descriçao do Personagem" readonly></textarea>
                </div>
            </div>

            <div id="areaElementosPersonagem">
            </div>
        </div>

    </div>
    <div name=" AddElement">
        <select name="" id="elemento" onchange="AdicionarElemento()">
            <option value="0" hidden>+Adicionar elemento</option>
            <option value="1">Características de Personagem</option>
            <option value="2">Barras de Personagem</option>
            <option value="3">Atributos</option>
            <option value="4">Perícias</option>
            <option value="5">Skills</option>
            <option value="6">Item</option>
            <option value="7">Criatura</option>
            <option value="8">Dado</option>
            <option value="9">Único</option>
        </select>
    </div>
    </div>
</body>
<script>
    let contadorCaracteristicas = 0;
    let contadorBarras = 0;
    function AdicionarElemento() {

        let select = document.getElementById("elemento");
        let valor = select.value;

        if (valor == "1") {
            contadorCaracteristicas++
            areaElementosPersonagem.innerHTML += `
        <div id="Características de Personagem" class="CharAtribute">
            <div class="vertical">
                <div class="TitleCaracterísticaPersonagem">
                    <div class="horizontal centralizar_linha">
                        <h4>Característica</h4>
                        <input type="text" id="Caracteristica_${contadorCaracteristicas}">

                        <!-- Função OnMouseOver e OnMouseOut do StackOverflow -->
                        <label for="Caracteristica_${contadorCaracteristicas}" class="fakeButton">
                            <img src="./assets/imgs_rpgreimagine/edit_text_No_Mouse.png"
                                onmouseover="this.src='./assets/imgs_rpgreimagine/edit_text_OnMouse.png'"
                                onmouseout="this.src='./assets/imgs_rpgreimagine/edit_text_No_Mouse.png'"
                                alt="editar nome">
                        </label>
                    </div>
                </div>
                <div class="vertical">
                    <div class="horizontal">
                        <input type="text" placeholder="Nome da Característica">
                        <label class="fakeButton">
                            <img src="./assets/imgs_rpgreimagine/Trash_No_Mouse.png"
                                onmouseover="this.src='./assets/imgs_rpgreimagine/Trash_OutMouse.png'"
                                onmouseout="this.src='./assets/imgs_rpgreimagine/Trash_No_Mouse.png'" alt="editar nome">
                        </label>
                    </div>
                </div>
                <button>+Nova característica</button>
            </div>`
        }

        if (valor == "2") {

            contadorBarras++;

            areaElementosPersonagem.innerHTML += `

        <div class="div_Barra">

            <div class="horizontal centralizar_linha">

                <button>editar_nome</button>

                <div class="vertical">

                    <h4>Barra ${contadorBarras}</h4>

                    <div>

                        <input 
                            type="number"
                            id="barraAtual${contadorBarras}"
                            value="100"
                            readonly
                        >

                        <label>/</label>

                        <input
                            type="number"
                            id="barraTotal${contadorBarras}"
                            value="100"
                            onchange="ValidarBarra(${contadorBarras})"
                        >

                    </div>

                </div>

                
                <label class="fakeButton">
                    <img src="./assets/imgs_rpgreimagine/Trash_No_Mouse.png"
                        onmouseover="this.src='./assets/imgs_rpgreimagine/Trash_OutMouse.png'"
                        onmouseout="this.src='./assets/imgs_rpgreimagine/Trash_No_Mouse.png'" alt="editar nome">
                </label>

            </div>

        </div>
        `;
        }

        // volta o select para o padrão
        select.value = "0";
    }

    function ValidarBarra(num) {

        let barraTotal = document.getElementById(`barraTotal${num}`);
        let barraAtual = document.getElementById(`barraAtual${num}`);

        let valor = Number(barraTotal.value);

        if (valor <= 0 || barraTotal.value == '') {
            valor = 0;
            barraTotal.value = 0;
        }

        barraAtual.value = valor;

        console.log(`Barra ${num} atualizada`);
    }

    //fazer com que, ao
</script>

</html>
