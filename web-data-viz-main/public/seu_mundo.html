<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG REIMAGINE | seu_mundo</title>
</head>

<style>
    .horizontal {
        display: flex;
        flex-direction: row;
    }

    .vertical {
        display: flex;
        flex-direction: column;
    }

    .centralizar_linha {
        align-items: center;
    }

    .centralizar_tudo {
        justify-content: center;
        align-items: center;
    }

    button {
        height: fit-content;
    }

    select {
        overflow: hidden;
        -webkit-appearance: none;
        padding: 3px;
        border: solid black 1.5px;
        border-radius: 3px
    }

    option {}
</style>

<body>
    <div class="container">
        <div class="horizontal centralizar_linha">
            <div>
                <img src="" alt="">
            </div>
            <h1>Seu mundo</h1>
        </div>
        <div>
            <h3>descrição:</h3>
            <div id="container">
                <span id="texto" onclick="tornarInput()">Clique para editar</span>
                <p contenteditable="true" oninput="Contar()" id="p_texto_editavel">Coloque aqui a descrição de seu
                    mundo.</p>
                <p id="contador_de_50"></p>
            </div>
        </div>
        <div class="vertical">
            <h3>Informações do personagem</h3>
            <div class="div_Imagem">
                <div class="horizontal centralizar_linha">
                    <button>editar_nome</button>
                    <div class="vertical centralizar_linha">
                        <h4>imagem do personagem</h4>
                        <p>imagem</p>
                    </div>
                    <button>excluir</button>
                </div>
            </div>

            <div id="areaElementos">
            </div>
        </div>

        <div id="Características de Personagem">
            <div class="vertical">
                <div class="horizontal centralizar_linha">
                    <h4>Característica</h4>
                    <button>editar_nome</button>
                </div>
                <div class="horizontal">
                    <input type="text">
                </div>
            </div>
            <button>excluir</button>
        </div>
        <div name=" AddElement">
            <select name="" id="elemento" onchange="AdicionarElemento()">
                <option value="0" hidden>+Adicionar elemento</option>
                <option value="1">Características de Personagem</option>
                <option value="2">Barras de Personagem</option>
                <option value="3">Atributos</option>
                <option value="4">Perícias</option>
                <option value="5">Skills</option>
                <option value="6">Item</option>
                <option value="7">Criatura</option>
                <option value="8">Dado</option>
                <option value="9">Único</option>
            </select>
        </div>
    </div>
</body>
<script>
    let limite = 50
    function Contar() {
        var texto_editavel = p_texto_editavel.textContent
        console.log(texto_editavel)
        if (texto_editavel.length >= limite - 10 && texto_editavel.length < limite) {
            contador_de_50.innerHTML = texto_editavel.length
        }
        else if (texto_editavel.length >= limite) {
            contador_de_50.innerHTML = "50+ seu texto chegou ao tamanho máximo"
        }
    }

    let contadorBarras = 0;

    function AdicionarElemento() {

        let select = document.getElementById("elemento");
        let valor = select.value;

        // adiciona uma barra de stamina
        if (valor == "2") {

            contadorBarras++;

            document.getElementById("areaElementos").innerHTML += `

        <div class="div_Barra">

            <div class="horizontal centralizar_linha">

                <button>editar_nome</button>

                <div class="vertical">

                    <h4>Barra ${contadorBarras}</h4>

                    <div>

                        <input 
                            type="number"
                            id="barraAtual${contadorBarras}"
                            value="100"
                            readonly
                        >

                        <label>/</label>

                        <input
                            type="number"
                            id="barraTotal${contadorBarras}"
                            value="100"
                            onchange="ValidarBarra(${contadorBarras})"
                        >

                    </div>

                </div>

                <button>excluir</button>

            </div>

        </div>
        `;
        }

        // volta o select para o padrão
        select.value = "0";
    }

    function ValidarBarra(num) {

        let barraTotal = document.getElementById(`barraTotal${num}`);
        let barraAtual = document.getElementById(`barraAtual${num}`);

        let valor = Number(barraTotal.value);

        if (valor <= 0 || barraTotal.value == '') {
            valor = 0;
            barraTotal.value = 0;
        }

        barraAtual.value = valor;

        console.log(`Barra ${num} atualizada`);
    }

    //fazer com que, ao
</script>

</html>
