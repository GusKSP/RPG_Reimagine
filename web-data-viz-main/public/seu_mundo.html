<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG REIMAGINE | seu_mundo</title>
    <link rel="stylesheet" href="css/rpgreimagine/SeuMundo.css">
</head>

<body>
    <div class="container">
        <img src="" alt="">
        <div class="horizontal centralizar_linha">
            <div class="vertical centralizar_linha">
                <div class="WImage">
                    <img src="./assets/imgs_rpgreimagine/World_IMG_example.png" alt="Imagem_Do_Mundo">
                </div>
                <label for="WDropImage" class="WDropImageButton">Alterar Imagem</label>
                <input type="file" id="WDropImage" accept="image/png, image/jpeg" multiple>
            </div>
            <input type="text" value="Seu Mundo" id="" class="WName">
        </div>
        <div class="mundo">
            <h3>descrição:</h3>
            <div id="container" class="descricao">
                <textarea id="" value="" placeholder="Coloque a descrição de seu mundo"></textarea>
            </div>
        </div>
        <div class="FirstCharInfo">
            <div class="vertical">
                <h3>Informações do personagem</h3>
                <div class="div_Imagem">
                    <div class="vertical">
                        <div class="horizontal centralizar_linha">
                            <div class="vertical centralizar_linha">
                                <h4>imagem</h4>
                                <div class="personagem_img"><img src="./assets/imgs_rpgreimagine/User_IMG_Exemple.png"
                                        alt="imagem_do_personagem"></div>
                            </div>
                            <h3>Nome do Personagem</h3>
                        </div>
                        <textarea name="descricao" placeholder="Descriçao do Personagem" readonly></textarea>
                    </div>
                </div>
            </div>

            <div id="areaElementosPersonagem">
                <div id="CaracteristcasPersonagem" class="horizontal">
                </div>
                <div id="BarrasPersonagem">
                </div>
                <div class="horizontal">
                    <div id="AtributosPersonagem" class="AtributosPersonagem">
                        <div class="vertical">
                            <div class="horizontal">
                                <label for="ipt_Elemento_Titulo_0" onclick="MostrarInput(0)" class="fakeButton">
                                    <img src="./assets/imgs_rpgreimagine/edit_text_No_Mouse.png"
                                        onmouseover="this.src='./assets/imgs_rpgreimagine/edit_text_OnMouse.png'"
                                        onmouseout="this.src='./assets/imgs_rpgreimagine/edit_text_No_Mouse.png'"
                                        alt="editar nome">
                                </label>
                                <div class="Atributo_Char vertical">
                                    <div class="horizontal">
                                        <h3 id="TituloElemento_0">ATR</h3>
                                        <input type="text" id="ipt_Elemento_Titulo_0" style="display: none;"
                                            onchange="AlterarNomeElemento(0)"> <br>
                                    </div>
                                    <input type="text" id="NumAtributo_0" oninput="ValidarAtributo(0)">
                                </div>
                                <label class="fakeButton">
                                    <img src="./assets/imgs_rpgreimagine/Trash_No_Mouse.png"
                                        onmouseover="this.src='./assets/imgs_rpgreimagine/Trash_OutMouse.png'"
                                        onmouseout="this.src='./assets/imgs_rpgreimagine/Trash_No_Mouse.png'"
                                        alt="editar nome">
                                </label>
                            </div>
                        </div>
                    </div>
                    <div id="PericiasPersonagem" class="PericiasPersonagem">
                    </div>
                    <div id="SkillsPersonagem" class="SkillsPersonagem">
                    </div>
                </div>
            </div>

        </div>
        <div name=" AddElement">
            <select name="" id="elemento" onchange="AdicionarElemento()">
                <option value="0" hidden>+Adicionar elemento</option>
                <option value="1">Características de Personagem</option>
                <option value="2">Barras de Personagem</option>
                <option value="3">Atributos</option>
                <option value="4">Perícias</option>
                <option value="5">Skills</option>
                <option value="6">Item</option>
                <option value="7">Criatura</option>
                <option value="8">Dado</option>
                <option value="9">Único</option>
            </select>
        </div>
    </div>
</body>
<script src="../src/models_rpg_reimagine/UsuarioRpgModel.js"></script>
<script>
    let contadorCaracteristicas = 0;
    let contadorBarras = 0;
    let contadorAtibutos = 0;
    let idTemporario = 0
    function AdicionarElemento() {

        let select = document.getElementById("elemento");
        let valor = select.value;

        if (valor == "1") {
            idTemporario++
            contadorCaracteristicas++
            // adicionando elemento de Caracteristica de Personagem
            CaracteristcasPersonagem.innerHTML += `
        <div id="Características de Personagem" class="CharAtribute">
            <div class="vertical">
                <div class="TitleCaracterísticaPersonagem">
                    <div class="horizontal centralizar_linha">
                        <!-- Função OnMouseOver e OnMouseOut do StackOverflow -->
                        <label for="ipt_Elemento_Titulo_${idTemporario}" onclick="MostrarInput(${idTemporario})" class="fakeButton">
                            <img src="./assets/imgs_rpgreimagine/edit_text_No_Mouse.png"
                                onmouseover="this.src='./assets/imgs_rpgreimagine/edit_text_OnMouse.png'"
                                onmouseout="this.src='./assets/imgs_rpgreimagine/edit_text_No_Mouse.png'"
                                alt="editar nome">
                        </label>
                        <h4 id="TituloElemento_${idTemporario}">Característica</h4>
                        <input type="text" id="ipt_Elemento_Titulo_${idTemporario}" style="display:none" onchange="AlterarNomeElemento(${idTemporario})">
                        <label class="fakeButton">
                            <img src="./assets/imgs_rpgreimagine/Trash_No_Mouse.png"
                                onmouseover="this.src='./assets/imgs_rpgreimagine/Trash_OutMouse.png'"
                                onmouseout="this.src='./assets/imgs_rpgreimagine/Trash_No_Mouse.png'" alt="editar nome">
                        </label>

                    </div>
                </div>
                <div class="vertical">
                    <div class="horizontal">
                        <input type="text" placeholder="Ex.(espécie, raça, nacionalidade, etc.)">
                    </div>
                </div>
            </div>`
        }

        if (valor == "2") {
            idTemporario++
            contadorBarras++;

            BarrasPersonagem.innerHTML += `

        <div class="div_Barra">

            <div class="horizontal centralizar_linha">

                
                        <label for="ipt_Elemento_Titulo_${idTemporario}" class="fakeButton" onclick="MostrarInput(${idTemporario})">
                            <img src="./assets/imgs_rpgreimagine/edit_text_No_Mouse.png"
                                onmouseover="this.src='./assets/imgs_rpgreimagine/edit_text_OnMouse.png'"
                                onmouseout="this.src='./assets/imgs_rpgreimagine/edit_text_No_Mouse.png'"
                                alt="editar nome">
                        </label>

                <div class="vertical">

                    <h4 id="TituloElemento_${idTemporario}">Barra</h4>
                    <input type="text" id="ipt_Elemento_Titulo_${idTemporario}" style="display:none" onchange="AlterarNomeElemento(${idTemporario})">

                    <div>

                        <input type="number" id="barraAtual${contadorBarras}"value="100" readonly>

                        <label>/</label>

                        <input
                            type="number"
                            id="barraTotal${contadorBarras}"
                            value="100"
                            onchange="ValidarBarra(${contadorBarras})"
                        >

                    </div>

                </div>

                
                <label class="fakeButton">
                    <img src="./assets/imgs_rpgreimagine/Trash_No_Mouse.png"
                        onmouseover="this.src='./assets/imgs_rpgreimagine/Trash_OutMouse.png'"
                        onmouseout="this.src='./assets/imgs_rpgreimagine/Trash_No_Mouse.png'" alt="editar nome">
                </label>

            </div>

        </div>
        `;
        }
        if (valor == "3") {
            idTemporario++
            contadorAtibutos++
        }

        // volta o select para o padrão
        select.value = "0";
    }
    // Fazendo Função de alterar Valor de Barras
    function ValidarBarra(num) {

        let barraTotal = document.getElementById(`barraTotal${num}`);
        let barraAtual = document.getElementById(`barraAtual${num}`);

        let valor = Number(barraTotal.value);

        if (valor <= 0 || barraTotal.value == '') {
            valor = 0;
            barraTotal.value = 0;
        }

        barraAtual.value = valor;

        console.log(`Barra ${num} atualizada`);
    }

    //Fazendo Função de alterar Nome de Caracterísicas:
    function MostrarInput(num) {

        let TitleChar = document.getElementById(`TituloElemento_${num}`)
        let InputChar = document.getElementById(`ipt_Elemento_Titulo_${num}`)

        console.log(TitleChar)
        console.log(InputChar)

        TitleChar.style.display = "none"
        InputChar.style.display = "inline"
    }
    function AlterarNomeElemento(num) {
        let TituloElementoAtual = document.getElementById(`TituloElemento_${num}`)
        let NovoNomeElemento = document.getElementById(`ipt_Elemento_Titulo_${num}`).value
        TituloElementoAtual.textContent = NovoNomeElemento
        NovoNomeElemento.value = ""
        ReaparecerTituloElemento(num)

    }
    function ReaparecerTituloElemento(num) {

        let TitleChar = document.getElementById(`TituloElemento_${num}`)
        let InputChar = document.getElementById(`ipt_Elemento_Titulo_${num}`)

        console.log(TitleChar)
        console.log(InputChar)

        TitleChar.style.display = "inline"
        InputChar.style.display = "none"
    }

    function ValidarAtributo(num) {
        let numeros = "1234567890"
        let AtributoHTML = document.getElementById(`NumAtributo_${num}`)
        console.log("Input: " + AtributoHTML.value)
        let NovoValor = AtributoHTML.value
        console.log("Novo Valor: " + NovoValor)
        let valorFinal = ""
        console.log("Valor Final: " + valorFinal)

        for (let i = 0; i < NovoValor.length; i++) {

            if (numeros.includes(NovoValor[i])) {

                valorFinal += NovoValor[i]
                console.log("Valor Final: " + valorFinal)
            }
        }
        AtributoHTML.value = valorFinal.toString()
        console.log("NovoInput: " + AtributoHTML.value)

    }
</script>

</html>
