<body>

        <div class="header">

</html>
<script>

    function entrar() {
        //aguardar();

        let emailVar = email_input.value;
        emailVar = emailVar.trim().toLowerCase()
        let senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            mostrarErro()
            mensagem_erro.innerHTML = "Preencha todos os campos!";
            finalizarAguardar();
            return false;
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuariosRpg/AutenticarRoute", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(function (json) {
                    console.log(json);
                    let usuario = json[0]
                    console.log(usuario)
                    console.log(JSON.stringify(json));
                    sessionStorage.ID_USUARIO = usuario.id_usuario;
                    sessionStorage.EMAIL_USUARIO = usuario.email;
                    sessionStorage.IMG_USUARIO = usuario.imagem_usuario
                    sessionStorage.NOME_USUARIO = usuario.nome;
                    sessionStorage.SUPER_USER = usuario.super_usuario;
                    //sessionStorage.AQUARIOS = JSON.stringify(json.aquarios)
                    mostrarErro()
                    mensagem_erro.innerHTML = "Login feito com sucesso! Redirecionando para a tela de Usuario... "

                    setTimeout(function () {
                        window.location = "./login_after/ver_mundos.html";
                    }, 1000);

                });

            }
            else {
                mostrarErro()
                mensagem_erro.innerHTML = "Houve um erro ao tentar realizar o login!"
                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    //finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

    function mostrarErro() {
        cardErro.style.display = "block";
        mensagem_erro.style.display = "block";
        setTimeout(sumirMensagem, 1000);
    }
</script>
