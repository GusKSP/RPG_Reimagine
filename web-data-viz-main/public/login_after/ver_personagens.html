<script>
    async function carregarPersonagens() {
        let id = sessionStorage.ID_USUARIO
        console.log(id)
        let respostas = await fetch("/personagemRpg/routeBuscarPersonagens", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                idServer: id
            })

        })
        let dados = await respostas.json();
        console.log(dados)
        PlotarPersonagem(dados)
    }
    let personagem = ""
    let personagem_id = ""
    let criacao = []
    let personagem_imagem = ""
    let descricao_personagem = ""
    function PlotarPersonagem(dados) {
        console.log(dados[0])
        for (let i = 0; i < dados.length; i++) {
            personagem = dados[i].nome
            console.log("nome: " + personagem)
            personagem_id = dados[i].id_personagem
            console.log("id: " + personagem_id)
            criacao = dados[i].dt_criacao.split("T")
            criacao = criacao[0].split("-")
            console.log(`data de criacao: ${criacao[2]}-${criacao[1]}-${criacao[0]}`)
            personagem_imagem = dados[i].imagem_personagem
            console.log(`imagem: ${personagem_imagem}`)
            descricao_personagem = dados[i].descricao
            console.log(`codigo: ${descricao_personagem}`)
            if (personagem_imagem == null) {
                personagem_imagem = "../assets/imgs_rpgreimagine/User_IMG_Exemple.png"
            }
            Personagens.innerHTML += `
            <div class="horizontal PersonagemView">
                <img src="${personagem_imagem}" alt="" class="PersonagemImagem">
                <div class="Personagem_desc">
                    <h3>${personagem}</h3>
                    <p class="subtitle">Criado em: ${criacao[2]}-${criacao[1]}-${criacao[0]}</p>
                </div>
                <div class="direita_Personagem">
                    <div class="box_Personagem">
                        <button onclick="mudarPersonagem(${personagem_id})">Alterar Personagem</button><br>
                        <button onclick="excluirPersonagem(${personagem_id})">Excluir Personagem</button><br>
                    </div>
                </div>
            </div>`

        }
    }
</script>
