    <main>
        <div id="Mesas">
        </div>
        <button onclick="window.location.href='criar_mundo.html'" class="Btn_criarMesa">+Criar Mesa</button>

<script>
    async function carregarMundos() {
        let id = sessionStorage.ID_USUARIO
        console.log(id)
        let respostas = await fetch("/mundosRouter/routeBuscarMundos", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                idServer: id
            })

        })
        let dados = await respostas.json();
        console.log(dados)
        PlotarMesa(dados)
    }
    let mesa = ""
    let mesa_id = ""
    let criacao = []
    let mesa_imagem = ""
    let codigo_mesa = ""
    function PlotarMesa(dados) {
        for (let i = 0; i < dados.length; i++) {
            mesa = dados[i].nome_mesa
            console.log("nome: " + mesa)
            mesa_id = dados[i].id_mesa
            console.log("id: " + mesa_id)
            criacao = dados[i].dt_criacao.split("T")
            criacao = criacao[0].split("-")
            console.log(`data de criacao: ${criacao[2]}-${criacao[1]}-${criacao[0]}`)
            mesa_imagem = dados[i].imagem_mesa
            console.log(`imagem: ${mesa_imagem}`)
            codigo_mesa = dados[i].codigo
            console.log(`codigo: ${codigo_mesa}`)
            if (mesa_imagem == null) {
                mesa_imagem = "../assets/imgs_rpgreimagine/World_IMG_Exemple.png"
            }
            if (codigo_mesa == null) {
                codigo_mesa = "--------"
            }
            Mesas.innerHTML += `
            <div class="horizontal MundoView">
                <img src="${mesa_imagem}" alt="" class="MesaImagem">
                <div class="mesa_desc">
                    <h3>${mesa}</h3>
                    <p class="subtitle">Criado em: ${criacao[2]}-${criacao[1]}-${criacao[0]}</p>
                </div>
                <div class="direita_mesa">
                    <div class="box_mesa">
                        <button onclick="mudarMesa(${mesa_id})">Alterar Regras</button><br>
                        <button onclick="excluirMesa(${mesa_id})">Excluir Mundo</button><br>
                        <p>Código: <input type="text" readonly value="${codigo_mesa}"></p>
                    </div>
                </div>
            </div>`

        }
    }
    function mudarMesa(num) {
        sessionStorage.ID_MUNDO = num
        window.location.href = "./mudar_mesa.html"
    }
    async function excluirMesa(id_mesa) {

        let resposta = await fetch("/mundosRouter/excluirMesa", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                idMesaServer: id_mesa
            })
        })

        if (resposta.ok) {
            alert("Mundo excluído com sucesso!")
            window.location.reload()
        } else {
            alert("Erro ao excluir mundo")
        }
    }
</script>
