<script>
    RemoverItens()
    async function carregarCampanhas() {
        let idUsuario = sessionStorage.ID_USUARIO;
        let resposta = await fetch("/campanhasRouter/buscarCampanhas", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                idUsuarioServer: idUsuario
            })
        });
        let campanhas = await resposta.json();
        console.log(campanhas);
        let divCampanhas = document.getElementById("divCampanhas");
        // divCampanhas.innerHTML = "";
        if (campanhas.length == 0) {
            divCampanhas.innerHTML = `
                <p>Você ainda não participa de nenhuma campanha.</p>
            `;
            return;
        }
        for (let i = 0; i < campanhas.length; i++) {
            let campanha = campanhas[i];
            let imagemMesa = campanha.imagem_mesa;
            let codigo = campanha.codigo_mesa
            if (imagemMesa == null) {
                imagemMesa = "../assets/imgs_rpgreimagine/World_IMG_example.png";
            }
            if (codigo == null) {
                codigo = "-------"
            }
            divCampanhas.innerHTML += `
                <div class="cardCampanha">
                    <div class="imagemCampanha">
                        <img src="${imagemMesa}" alt="Imagem campanha">
                    </div>
                    <div class="horizontal fill">
                        <div class="vertical">
                            <h2>${campanha.Nome_Mesa}</h2>
                            <p><b>Código:</b> ${codigo}</p>
                            <p>
                                <b>Criador:</b>
                                ${campanha.nome_criador}
                            </p>
                        </div>
                        <div class="infosCampanha">
                                <button onclick="verInformacoes(${campanha.Id_Mesa})" class="Btn_unico"> Informações da campanha
                                </button>
                                <button onclick="ConfirmarSaida(${campanha.Id_Mesa})" class="Btn_unico"> Sair da campanha
                                </button>
                        </div>
                        </div>
                </div>
            `;
        }
    }
    let modal = document.getElementById("modal")
    let codigoCampanha = document.getElementById("Codigo_campanha")
    function EntrarEmCampanha() {
        modal.style.display = "flex"
        modal.innerHTML = `
            <div class="modal_content">
                <h1>Entrar Em Campanha</h1>
                <div class="formulario">
                    <h3>Insira o código da campanha</h3>
                    <input type="text" id="Codigo_campanha" oninput="VerificarCodigo()" placeholder="Código da Campanha"
                        maxlength="8">
                    <div class="horizontal">
                        <button class="Btn_unico" onclick="Cancelar()">Cancelar</button>
                        <button class="Btn_unico" onclick="Confirmar()">Confirmar</button>
                    </div>
                </div>`
        codigoCampanha.value = ""
    }

    function VerificarCodigo() {
        let input = document.getElementById("Codigo_campanha");
        let DigitosHex = "1234567890abcdefABCDEF";
        let valorFinal = "";

        for (let i = 0; i < input.value.length; i++) {
            let caractere = input.value[i];
            if (DigitosHex.includes(caractere)) {
                valorFinal += caractere;
            }
        }
        input.value = valorFinal;
    }

    function verInformacoes(idMesa) {
        sessionStorage.ID_MESA = idMesa
        window.location.href = "Info_Campanha.html"
    }

    async function Confirmar() {
        let codigo = document.getElementById("Codigo_campanha").value;

        if (codigo.length < 8) {
            alert("Código Inválido!");
            return;
        }

        let resposta = await fetch("/campanhasRouter/entrarCampanha", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                codigoServer: codigo,
                idUsuarioServer: sessionStorage.ID_USUARIO
            })
        });

        if (resposta.ok) {
            let dados = await resposta.json();
            if (dados.length == 0) {
                alert("Campanha não encontrada!");
                return;
            }
            alert("Você entrou na campanha!");
            modal.style.display = "none";
            window.location.reload()
        } else {
            alert("Erro ao entrar na campanha!");
        }
    }

    function ConfirmarSaida(id_mesa) {
        let modal = document.getElementById("modal")
        modal.style.display = "flex"
        modal.innerHTML = `
            <div class="modal_content">
                <h1>Sair da Campanha</h1>
                <h3>Tem certeza que deseja sair da campanha?</h3>
                <div class="formulario">
                    <div class="horizontal">
                        <button class="Btn_unico" onclick="Cancelar()">Cancelar</button>
                        <button class="Btn_unico" onclick="SairDaCampanha(${id_mesa})">Confirmar</button>
                    </div>
                </div>`
    }

    async function SairDaCampanha(id_mesa) {
        let modal = document.getElementById("modal")
        id_usuario = sessionStorage.ID_USUARIO
        console.log(id_mesa)
        console.log(id_usuario)
        let resposta = await fetch("/campanhasRouter/sairCampanha", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                mesaServer: id_mesa,
                idUsuarioServer: id_usuario
            })
        });

        if (resposta.ok) {
            let dados = await resposta.json();
            if (dados.length == 0) {
                alert("Campanha ou Usuário não encontrado!");
                return;
            }
            alert("Você saiu da campanha!")
            modal.style.display = "none";
            window.location.reload()
        } else {
            alert("Erro ao sair da campanha!");
            modal.style.display = "none"
        }
    }

    function Cancelar() {
        modal.style.display = "none"
        codigoCampanha.value = ""
    }

</script>
