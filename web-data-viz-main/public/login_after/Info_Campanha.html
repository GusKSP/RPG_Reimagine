<script>
    async function SicronizarUsuarios() {

        let idMesa = sessionStorage.ID_MESA;

        let resposta = await fetch("/campanhasRouter/buscarUsuariosCampanha", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                idMesaServer: idMesa
            })
        });

        if (!resposta.ok) {
            console.log("Erro na requisição:", resposta.status);
            return;
        }

        let dados = await resposta.json();

        console.log("USUÁRIOS DA CAMPANHA:", dados);

        let container = document.getElementById("usuariosRpg");

        for (let i = 0; i < dados.length; i++) {

            let usuario = dados[i];
            console.log(usuario)
            let data = (usuario.dt_entrada).split("T")
            console.log(data)
            data = data[0].split("-")
            console.log(data)
            data = `${data[2]}/${data[1]}/${data[0]}`
            console.log(data)
            console.log(usuario)
            console.log(usuario.Id_Criador)
            console.log(sessionStorage.ID_USUARIO)
            if (usuario.Id_Criador == sessionStorage.ID_USUARIO) {

                container.innerHTML += `
                <div class="Usuario">
                    <div class="horizontalEspaco">
                        
                        <div class="horizontal centralizar_tudo gaps">
                            
                            <div class="vertical centralizar_tudo UserImage">
                                <img src="${'../assets/imgs_rpgreimagine/User_IMG_Exemple.png'}" alt="Usuario">
                                </div>
                                
                                <div class="vertical centralizar_tudo">
                                    <h3>${usuario.Nome_Usuario}</h3>
                                    <p class="data">Data de Entrada: ${data}</p>
                                    </div>
                                    
                                    </div>
                                    
                                    <div class="vertical">
                                        <button class="Btn_unico"
                                        onclick="AbrirModal(${usuario.Id_Usuario}, ${usuario.Id_Mesa})">
                                        Remover Usuário
                                        </button>
                                        </div>
                                        
                                        </div>
                                        </div>`;
            }
            else {
                container.innerHTML += `
                <div class="Usuario">
                    <div class="horizontalEspaco">
                        
                        <div class="horizontal centralizar_tudo gaps">
                            
                            <div class="vertical centralizar_tudo UserImage">
                                <img src="${'../assets/imgs_rpgreimagine/User_IMG_Exemple.png'}" alt="Usuario">
                                </div>
                                
                            <div class="vertical centralizar_tudo">
                                <h3>${usuario.Nome_Usuario}</h3>
                                <p class="data">Data de Entrada: ${data}</p>
                            </div>
                                    
                        </div>
                    </div>
                </div>`;
            }
        }
    }
    let idUsuarioSelecionado = null;
    let idMesaSelecionada = null;

    function AbrirModal(idUsuario, idMesa) {

        idUsuarioSelecionado = idUsuario;
        idMesaSelecionada = idMesa;

        let modal = document.getElementById("modal");
        modal.style.display = "flex";
    }

    function CancelarModal() {
        let modal = document.getElementById("modal");
        modal.style.display = "none";
        window.location.reload()
        idUsuarioSelecionado = null;
        idMesaSelecionada = null;
    }

    async function ConfirmarRemocao() {

        let resposta = await fetch("/campanhasRouter/sairCampanha", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                mesaServer: idMesaSelecionada,
                idUsuarioServer: idUsuarioSelecionado
            })
        });

        if (resposta.ok) {
            CancelarModal();
            SicronizarUsuarios();
        } else {
            console.log("Erro ao remover usuário");
        }
    }
</script>
